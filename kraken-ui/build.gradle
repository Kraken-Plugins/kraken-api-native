plugins {
    id 'java-library'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

// Project version is set via the VERSION environment
// variable in the Github Actions workflow and should not be changed here.
def projectVersion = System.getenv("VERSION") ?: '1.0.0'

version = projectVersion
project.version = projectVersion

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
    mavenLocal()
}

dependencies {
    // Dependencies included within RuneLite's bootstrap at runtime
    compileOnly("org.slf4j:slf4j-api:1.7.25")
    compileOnly("org.slf4j:slf4j-simple:1.7.25")
    compileOnly("com.google.code.gson:gson:2.8.5")
    compileOnly("com.google.guava:guava:31.1-jre")
    compileOnly("com.google.inject:guice:4.2.2")

    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'

    testCompileOnly 'org.projectlombok:lombok:1.18.30'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.30'

    testImplementation 'junit:junit:4.12'
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.10.0'

    testRuntimeOnly 'org.junit.jupiter:junit-jupiter-engine:5.10.0'
    testRuntimeOnly 'org.junit.vintage:junit-vintage-engine:5.10.0'
}

test {
    useJUnitPlatform()
}

sourceSets {
    test {
        java {
            srcDirs = ['src/test/java', 'tests/sim']
        }
    }
}


java {
    withSourcesJar()
    withJavadocJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(11)
    }
}

jar {
    archiveBaseName = 'kraken-ui'
    archiveVersion = projectVersion
    archiveClassifier = 'unshaded'
}
